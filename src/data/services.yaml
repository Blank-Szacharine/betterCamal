# Government Services Data
# This file contains all the service categories for the government portal
# Each category's index.yaml file is automatically located at content/services/{slug}/index.yaml
# Non-technical users can easily edit this file to add, remove, or modify service categories

categories:
  - category: 'Health Services'
    slug: 'health-services'
    description: 'Official Camalaniugan health programs and services listed in the Citizen’s Charter.'
    icon: 'Heart'

  - category: 'Planning & Development'
    slug: 'planning-development'
    description: 'Zoning compliance and planning-related services of the Municipal Planning and Development Office.'
    icon: 'Map'

  - category: 'Environment & Natural Resources'
    slug: 'environment-natural-resources'
    description: 'Municipal Environment and Natural Resources Office directory.'
    icon: 'TreePine'

  - category: 'Municipal Budget Office'
    slug: 'municipal-budget'
    description: 'Budget processing and barangay budget-review services.'
    icon: 'WalletCards'
